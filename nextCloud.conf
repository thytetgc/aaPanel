# --- 1. SEGURANÇA GLOBAL E TIMEOUTS ---
# Resolve o alerta de HSTS
add_header Strict-Transport-Security "max-age=15552000; includeSubDomains; preload;" always;

# Configurações para arquivos gigantes (60GB)
client_max_body_size 0;
proxy_buffering off;
fastcgi_request_buffering off;

# --- 2. PROTEÇÃO DO DIRETÓRIO DE DADOS (ERRO CRÍTICO) ---
# Impede o acesso externo à pasta /data
location ^~ /data {
    deny all;
    return 404;
}

# --- 3. REDIRECIONAMENTOS WELL-KNOWN & OCM ---
location ^~ /.well-known {
    location = /.well-known/carddav        { return 301 /remote.php/dav; }
    location = /.well-known/caldav         { return 301 /remote.php/dav; }
    location = /.well-known/host-meta      { return 301 /public.php?service=host-meta; }
    location = /.well-known/host-meta.json { return 301 /public.php?service=host-meta-json; }
    location = /.well-known/webfinger      { return 301 /index.php/.well-known/webfinger; }
    location = /.well-known/nodeinfo       { return 301 /index.php/.well-known/nodeinfo; }
    try_files $uri $uri/ /index.php$request_uri;
}
location = /ocm-provider/ { return 301 /index.php/ocm-provider; }

# --- 4. SUPORTE MICROSOFT DAV E BLOQUEIOS ---
location = / {
    if ($http_user_agent ~ ^DavClnt) {
        return 302 /remote.php/webdav/$is_args$args;
    }
}
location ~ ^/(?:build|tests|config|lib|3rdparty|templates)(?:$|/) { return 404; }
location ~ ^/(?:\.|autotest|occ|issue|indie|db_|console)           { return 404; }

# --- 5. PROCESSAMENTO PHP 8.3 (TÚNEL DE 4 HORAS) ---
location ~ \.php(?:$|/) {
    fastcgi_split_path_info ^(.+?\.php)(/.*)$;
    set $path_info $fastcgi_path_info;
    try_files $fastcgi_script_name =404;

    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $path_info;
    fastcgi_param HTTPS on;
    fastcgi_param modHeadersAvailable true;
    fastcgi_param front_controller_active true;

    # Conexão com o seu socket PHP 8.3
    fastcgi_pass unix:/tmp/php-cgi-83.sock;

    # Timeouts Sincronizados (14400s = 4 Horas)
    fastcgi_read_timeout 14400s;
    fastcgi_send_timeout 14400s;
    fastcgi_connect_timeout 14400s;

    fastcgi_max_temp_file_size 0;
    fastcgi_intercept_errors on;
}

# --- 6. ARQUIVOS ESTÁTICOS E CORREÇÃO DE INTERFACE (.MJS) ---
location ~ \.(?:css|js|mjs|svg|gif|png|jpg|jpeg|ico|wasm|tflite|map|json|html|ttf|woff|woff2)$ {
    try_files $uri /index.php$request_uri;
    
    # IMPORTANTE: Carrega tipos padrão + .mjs (Resolve a interface quebrada)
    include mime.types;
    types {
        text/javascript js mjs;
        application/wasm wasm;
    }

    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains; preload;" always;
    add_header Cache-Control "public, max-age=15778463" always;
    access_log off;
}

# --- 7. ROTA RAIZ E REMOTE ---
location /remote { return 301 /remote.php$request_uri; }
location / {
    try_files $uri $uri/ /index.php$request_uri;
}
